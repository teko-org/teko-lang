name: Release

# ==============================================================================
# THE RELEASE PROMOTES. IT DOES NOT REBUILD.
#
# The deliverable of this repository is the taught teko compiler that lives at
# its root (it was `ngen/` until the rebase). Cutting a version is therefore:
#
#   1. run the ngen gate over the TAG -- the five native legs (each one runs
#      every fixture on its own os AND arch) and the fixpoint ladder;
#   2. package, INSIDE each leg, the `build/teko` those fixtures have just
#      run against;
#   3. attach the ten files to the tag's GitHub Release, with notes that name
#      the mc version and carry the fixpoint's own hashes;
#   4. announce the release to the mc package registry -- when the owner has
#      registered the package and turned the switch on.
#
# Step 2 is what makes step 3 honest, and it is why there is no separate
# `assets` job: a job that compiled the compiler again would publish bytes NO
# GATE EVER SAW. (This repository's previous release workflow was rewritten for
# exactly that reason: if the binary produced in the first stage passed every
# gate, the release only has to promote it.) The gate is
# `ngen.yml` itself, called with `workflow_call`, so the release cannot drift
# from the CI: there is one matrix, one `setup-mc`, one packaging action.
#
# HOW TO CUT A VERSION
#
#   git tag -a v0.3.1 -m "teko 0.3.1" && git push origin v0.3.1
#
# or, for a tag that already exists:
#
#   gh workflow run release.yml --ref v0.3.1
#
# (or the Actions tab -> Release -> Run workflow, choosing the `v0.3.1` tag as
# the branch/tag to run on). Both roads end in the same four jobs; the ref the
# run is dispatched ON is the version, and there is no VERSION file and no
# `version` input to trust.
#
# A version carrying a `-` suffix (`0.3.1-rc1`, `0.0.0-test`) is published as a
# PRE-RELEASE: it never becomes "latest" and `mc pkg add` never chooses it
# without being named explicitly (mc docs/guide/27-publishing.md § 4).
# ==============================================================================

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One place decides what is being released, so the three jobs below cannot
  # disagree about it. The only source of truth is this run's OWN ref: GitHub
  # has already resolved and would check it out before any job here starts, so
  # `github.ref_type == 'tag'` is proof enough that the tag exists -- there is
  # no separate input to distrust and nothing left for a `gh api` round trip
  # to confirm.
  version:
    name: What is being released
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      version: ${{ steps.derive.outputs.version }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
    steps:
      - name: derive the tag and the version
        id: derive
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::this run is on $REF_TYPE '$REF_NAME', not a tag -- push a v* tag or dispatch with --ref vX.Y.Z" >&2
            exit 1
          fi
          tag="$REF_NAME"
          case "$tag" in
            v*) : ;;
            *) echo "::error::'$tag' is not a release tag (it must start with 'v')" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          # X.Y.Z, optionally followed by a pre-release suffix
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a X.Y.Z version" >&2
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "tag=$tag"               >>"$GITHUB_OUTPUT"
          echo "version=$version"       >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"
          echo "releasing $tag as teko $version (prerelease: $prerelease)"

  # The gate IS the CI workflow, called over the tag. Five legs plus the two
  # fixpoint runners, exactly what a pull request gets -- and, with
  # `package: true`, each leg also packages the binary it has just proven and
  # each fixpoint runner archives its provenance table.
  gate:
    name: ngen gate
    needs: version
    uses: ./.github/workflows/ngen.yml
    with:
      package: true
      version: ${{ needs.version.outputs.version }}

  release:
    name: Publish the release
    needs: [version, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: check out the tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # Ten files: a `.tar.gz` and a `.sha256` for each of the five legs.
      - name: collect the packaged assets
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: collect the fixpoint provenance
        uses: actions/download-artifact@v7
        with:
          pattern: provenance-*
          path: provenance

      - name: every asset a leg owes must be here
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          missing=0
          for target in linux-x86_64 linux-arm64 macos-arm64 windows-x86_64 windows-arm64; do
            for f in "dist/teko-$VERSION-$target.tar.gz" "dist/teko-$VERSION-$target.tar.gz.sha256"; do
              if [ ! -s "$f" ]; then
                echo "::error::$f is missing" >&2
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ]
          ls -l dist

      # The notes say what a downloader needs and what an auditor asks for: the
      # toolchain that built it, the checksum of every file, and the ladder's own
      # numbers. The mc version is read out of the provenance table rather than
      # passed around, so the note and the measurement have one source.
      - name: compose the release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" || true
          annotation=$(git tag -l --format='%(contents)' "$TAG")
          mcver=$(sed -n 's/.*, mc \([0-9][0-9.]*\).*/\1/p' provenance/*/provenance.md | head -1)
          {
            if [ -n "$annotation" ]; then
              printf '%s\n' "$annotation"
            else
              echo "teko $VERSION -- the teko compiler, taught to mc."
            fi
            echo
            echo "Built and proven by the \`ngen\` gate over this tag: five native legs"
            echo "(linux/x86_64, linux/aarch64, macos/aarch64, windows/x86_64,"
            echo "windows/aarch64), each one running every fixture on its own operating"
            echo "system AND architecture, plus the self-hosting fixpoint ladder"
            echo "(teko0 -> teko1 -> teko2 -> teko3) on linux/x86_64 and macos/aarch64."
            echo "The binaries attached here are the ones those fixtures ran against."
            echo
            echo "## Toolchain"
            echo
            if [ -n "$mcver" ]; then
              echo "Built with **mc $mcver** (<https://github.com/minicompiler/mc>)."
            else
              echo "Built with the latest release of mc (<https://github.com/minicompiler/mc>)."
            fi
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "# macOS (arm64)"
            echo "tar xzf teko-$VERSION-macos-arm64.tar.gz"
            echo "xattr -d com.apple.quarantine teko-$VERSION-macos-arm64/teko"
            echo "install -m 755 teko-$VERSION-macos-arm64/teko /usr/local/bin/teko"
            echo
            echo "# Linux (x86_64 or arm64)"
            echo "tar xzf teko-$VERSION-linux-x86_64.tar.gz"
            echo "install -m 755 teko-$VERSION-linux-x86_64/teko /usr/local/bin/teko"
            echo
            echo "# Windows (x86_64 or arm64)"
            echo "tar xzf teko-$VERSION-windows-x86_64.tar.gz"
            printf '%s\n' "copy teko-$VERSION-windows-x86_64\\teko.exe C:\\tools\\teko.exe"
            echo '```'
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
            echo
            echo "## Fixpoint"
            echo
            for f in provenance/*/provenance.md; do
              [ -f "$f" ] && cat "$f"
              echo
            done
          } >"$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Create, or update in place: a rerun of this job after a red
      # `publish-to-registry` must not be blocked by the release it already made.
      - name: create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -eu
          pre=""
          [ "$PRERELEASE" = "true" ] && pre="--prerelease"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release -- updating it"
            gh release upload "$TAG" dist/teko-*.tar.gz dist/teko-*.tar.gz.sha256 --clobber
            # shellcheck disable=SC2086
            gh release edit "$TAG" --title "teko $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" $pre
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" --title "teko $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $pre \
              dist/teko-*.tar.gz dist/teko-*.tar.gz.sha256
          fi
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}'

  # The registry side (mc docs/guide/27-publishing.md). Two halves:
  #
  #   * a PRE-FLIGHT that always runs -- `mc pkg hash` of the tagged tree and a
  #     compile of every `[package].check` unit with the STOCK mc, which is what
  #     the registry's own validator does inside its sandbox (§ 5). Finding out
  #     here that a check unit does not build is worth the two minutes; finding
  #     out from a `failed` job report is not;
  #   * the ANNOUNCEMENT, gated by the repository variable
  #     TEKO_REGISTRY_PUBLISH. The package has to be registered once, by a
  #     person, at https://minicompiler.dev/me (§ 3); until the owner has done
  #     that the registry answers `404 not registered` and a job that ran
  #     anyway would be red on every release, hiding a real failure. Without the
  #     variable this job prints the plan and exits 0 -- it is never a lie about
  #     having published.
  #
  # `mc pkg check` is NOT what runs here: it takes an INDEX file of a registry
  # (`mc pkg check INDEX.toml`), which is the registry's own CI gate over a row
  # that already exists, not a directory validator.
  publish-to-registry:
    name: Publish to the mc registry
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: check out the tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: set up the mc toolchain
        id: mc
        uses: ./.github/actions/setup-mc
        with:
          os: linux
          arch: x86_64
          asset: x86_64
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: the tree hash a consumer will lock
        run: |
          set -eu
          echo "mc pkg hash . = $("$MC" pkg hash .)"

      # Each entry of `[package].check` is one translation unit, compiled ON ITS
      # OWN by a stock mc on linux/x86_64, with no network and no teko module
      # loaded (docs/reference/packages.md § 3). With no `check` key the unit is
      # `lib`, so that is the fallback here too.
      - name: compile every [package].check unit with the stock mc
        run: |
          set -eu
          units=$(sed -n 's/^check *= *\[\(.*\)\].*/\1/p' mc.toml | tr -d '" ' | tr ',' ' ')
          if [ -z "$units" ]; then
            units=$(sed -n 's/^lib *= *"\(.*\)".*/\1/p' mc.toml)
          fi
          if [ -z "$units" ]; then
            echo "::error::mc.toml names neither [package].check nor [package].lib" >&2
            exit 1
          fi
          for unit in $units; do
            echo "--- $unit"
            "$MC" "$unit" -o "$RUNNER_TEMP/check.o"
            echo "    ok: $unit compiles on its own"
          done

      - name: announce the release to the registry
        if: vars.TEKO_REGISTRY_PUBLISH == '1'
        uses: minicompiler/register-action@v1
        with:
          tag: ${{ needs.version.outputs.tag }}

      - name: what would have been announced
        if: vars.TEKO_REGISTRY_PUBLISH != '1'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          echo "TEKO_REGISTRY_PUBLISH is not \"1\": nothing was announced, and that is not a failure."
          echo
          echo "With the variable set, this job runs minicompiler/register-action@v1 with"
          echo "tag=$TAG. The action POSTs https://minicompiler.dev/poll with"
          echo "git_url=https://github.com/$GITHUB_REPOSITORY, waits for the validator's job,"
          echo "prints its report and asserts that https://pkg.minicompiler.dev/index/teko.toml"
          echo "carries version = \"${TAG#v}\"."
          echo
          echo "Before that can work, once and by a person (guide 27 § 3):"
          echo "  1. log in at https://minicompiler.dev/login and accept the documents;"
          echo "  2. POST /repos on /me with git_url = https://github.com/$GITHUB_REPOSITORY;"
          echo "  3. set the repository variable TEKO_REGISTRY_PUBLISH to 1."
