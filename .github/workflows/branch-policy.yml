# .github/workflows/branch-policy.yml -- the gate on where a pull request comes FROM.
#
# GitHub cannot say "this branch may not target that one": rulesets protect the TARGET and do not
# filter the SOURCE. This job is the only way to express it -- it runs on every pull request, it is
# cheap (seconds, no checkout) and, named as a *required status check* in `main`'s ruleset, it makes
# the merge impossible rather than merely discouraged.
#
# WHICH NAMESPACES: `theory/**` and `cargo/**` are, by design, branches WITHOUT A GATE of their own
# -- `theory/**` is exploration, `cargo/**` is freight that never passed a gate (the train pays the
# gate once, at the wagon). Neither may flow straight into a protected branch.
#
# SECURITY NOTE: `github.head_ref` is text CONTROLLED BY WHOEVER OPENS THE PULL REQUEST (a fork's
# branch name accepts shell metacharacters). Interpolating `${{ github.head_ref }}` INSIDE `run:`
# would be command injection -- the value comes in through `env:` and is read as a quoted variable,
# never expanded by the script generator.
name: Branch policy

on:
  pull_request:
    branches: ['**']   # '**' crosses '/' -- it matches a base with a slash; plain '*' does not

permissions:
  contents: read

jobs:
  source-namespace:
    name: Branch policy gate
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an ungated namespace against a protected base
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          case "$BASE_REF" in
            main|remodel/*) ;;
            *) echo "base '$BASE_REF' is not protected -- nothing to enforce"; exit 0 ;;
          esac
          case "$HEAD_REF" in
            theory/*|cargo/*)
              echo "REFUSED: '$HEAD_REF' is an UNGATED namespace and cannot target '$BASE_REF'." >&2
              echo "These branches carry work that never passed a gate of its own:" >&2
              echo "  theory/** -- exploration;  cargo/** -- freight (the wagon pays the gate)." >&2
              echo "Land the freight on a wagon branch and take the WAGON to the protected branch." >&2
              exit 1
              ;;
          esac
          echo "head '$HEAD_REF' -> base '$BASE_REF': allowed"
