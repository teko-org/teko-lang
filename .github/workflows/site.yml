name: site

# Builds teko-lang.org out of `docs/` and publishes the rendered pages to the
# `site` branch, which the VPS that serves the domain pulls every five minutes
# (DECISION_LOG.md D36): no deploy credential leaves this repository, because
# the repository is public and the server only ever reads it.
#
# THE GENERATOR IS NOT VENDORED. `mcsite` is `minicompiler/mc`'s own site
# generator, written in mc: this workflow checks that repository out at the TAG
# `MC_VERSION` pins -- the same release `setup-mc` downloads -- builds `mcsite`
# there with that release, and runs the binary over `site/site.toml`. So the
# generator can never drift from the compiler this repository is pinned to, and
# raising the pin moves both at once. Everything `mcsite` needs at run time is
# resolved against the directory holding `site.toml` (the templates, the static
# files, `tools/*.py`), so nothing of the mc checkout is read after the build.
#
# `--check` is the gate: it resolves every internal link of every page it wrote,
# then spawns `site/tools/checkhtml.py` (structure, accessibility and the three
# Content-Security-Policy rules) and `site/tools/contrast.py` (WCAG ratios read
# out of `site/static/site.css`). It runs on a PULL REQUEST too, without
# deploying, so a documentation page that breaks the site is caught before the
# merge and not after it.
#
# `[site] base_url` is `/`: the site is served at the root of its own domain.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, and never cancel one halfway: two force-pushes of the
# `site` branch racing each other would leave the server with whichever won. A
# pull request's check is its own group, so it never queues behind a publish.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The same action every other job uses, so the site is rendered by the
      # generator of the release the fixtures were proved on.
      - name: set up the mc toolchain
        id: mc
        uses: ./.github/actions/setup-mc
        with:
          os: linux
          arch: x86_64
          asset: x86_64
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: check minicompiler/mc out at the pinned tag
        uses: actions/checkout@v5
        with:
          repository: minicompiler/mc
          ref: ${{ steps.mc.outputs.tag }}
          path: _mc
          persist-credentials: false

      # site/mc.linux.toml is site/mc.toml with the Linux host layer of the
      # generator (the `struct dirent` offsets); it carries no [target], so the
      # build takes the pair of this runner and mc's own ELF writer emits the
      # executable -- no linker and no sysroot. With no [target] it also takes
      # the DEFAULT PT_INTERP, which is musl's loader; a GitHub runner is
      # glibc, and such a binary answers `cannot execute: required file not
      # found` the moment anything runs it. So the config is DERIVED, never
      # edited: the host pair written out plus this machine's own loader,
      # exactly the tail ngen.yml's two Linux legs append to teko.toml.
      # (`libc` is a family since mc 0.12.1; the pin is 0.15.23 and only moves
      # forward.) The binary lands in _mc/build/mcsite.
      - name: build mcsite from that checkout
        env:
          MC_DIR: ${{ steps.mc.outputs.dir }}
        run: |
          set -eu
          cd _mc
          cp site/mc.linux.toml site/mc.ci.toml
          cat >>site/mc.ci.toml <<'TOML'

          [target]
          os     = "linux"
          arch   = "x86_64"
          interp = "/lib64/ld-linux-x86-64.so.2"
          libc   = "gnu"
          TOML
          cat site/mc.ci.toml
          "$MC_DIR/mc" build site --config site/mc.ci.toml
          test -x build/mcsite

      - name: render the site and check it
        run: |
          set -eu
          _mc/build/mcsite site --check

      - name: assemble public/
        run: |
          set -eu
          rm -rf public
          cp -R site/public public
          find public -maxdepth 2 | sort | head -40

      - name: hand public/ to the publish job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: public
          retention-days: 1
          if-no-files-found: error

  # The only job that can write to the repository: it force-pushes the rendered
  # tree as an orphan commit on the `site` branch, and nothing else. `build`
  # keeps `contents: read`, so a pull request's check never holds a write token.
  publish:
    name: publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: take public/ from the build job
        uses: actions/download-artifact@v4
        with:
          name: site-public
          path: public

      - name: publish public/ to the site branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # An orphan commit holding exactly the rendered tree: the branch carries
          # no history on purpose, one commit per publish, force-pushed. The
          # server's puller checks the branch out and serves it as it is.
          cd public
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: ${GITHUB_SHA} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site:site
          echo "published $(git rev-parse --short HEAD) to the site branch"
