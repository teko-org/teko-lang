name: CodeQL

# Runs on PULL REQUESTS only: a green PR already proved the head, and the
# post-merge push would just re-run it.
#
# WHAT IS LEFT TO SCAN. `src/` is frozen (D211/D212) and the work lives in
# `ngen/`, which is `.tk` and `.mc` -- languages CodeQL has no analyzer for. The
# `c-cpp` leg that used to compile `src/runtime/teko_rt.c` and
# `src/assert/assert.c` scanned exactly that frozen tree, so it was re-proving
# bytes nobody may change; it is gone with the rest of the old compiler's CI.
# What remains is `actions`, and it is not decoration: this repository's CI is
# now four workflows and two composite actions that download a toolchain, run a
# `gh release create` with `contents: write`, and interpolate branch names --
# the class of thing the `actions` analyzer exists for.
#
# NOTE on the `paths:` filter: a GitHub required check that stops REPORTING goes
# pending forever, not red. Should the `code_scanning` ruleset rule ever be
# switched on for `main`, this filter has to go -- a docs-only pull request
# would otherwise sit blocked "waiting for CodeQL". Today the `main` ruleset
# requires only `mc build ngen && run` (ngen/HANDOFF.md §3.4).
on:
  pull_request:
    branches: ['**']   # '**' cruza '/' — casa base com barra; '*' simples nao
    paths: ['ngen/**', '.github/**']

# Restrict default token scope for all jobs in this workflow.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
