name: CodeQL

# Runs on PULL REQUESTS only: a green PR already proved the head, and the
# post-merge push would just re-run it.
#
# WHAT IS LEFT TO SCAN. The work is the repository root, which is `.tk` and
# `.mc` -- languages CodeQL has no analyzer for. The `c-cpp` leg that used to
# compile `src/runtime/teko_rt.c` and `src/assert/assert.c` scanned the old
# compiler's frozen tree, and that tree is gone with the rest of its CI.
# What remains is `actions`, and it is not decoration: this repository's CI is
# now four workflows and two composite actions that download a toolchain, run a
# `gh release create` with `contents: write`, and interpolate branch names --
# the class of thing the `actions` analyzer exists for.
#
# NO `paths:` FILTER. A GitHub required check that stops REPORTING goes pending
# forever, not red, so a filter that a pull request happens not to match would
# block it the day the `code_scanning` ruleset rule is switched on for `main`.
# The old path filter also named `ngen/**`, a directory that no longer exists:
# the port IS the root now, and every pull request touches something under it.
# It reports on every one of them instead.
on:
  pull_request:
    branches: ['**']   # '**' crosses '/' -- it matches a base with a slash; plain '*' does not

# Restrict default token scope for all jobs in this workflow.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
