# mc.toml -- this repository, as the package `teko`. It carries NO [project]:
# the build config is `teko.toml` (`mc build . --config teko.toml`), because
# `mc pkg hash DIR` reads `DIR/mc.toml` and takes no `--config`, so the package
# manifest and the build config cannot share one file once the package IS the
# repository. It is the split `minicompiler/mc`'s own root uses, and it is why
# `mc build .` here answers `missing key: project.entry`, on purpose.
#
# The tree hash digests these BYTES, comments included, so this header is
# written once and left alone. What `lib`, `files` and `check = ["mc_teko.tk"]`
# mean (a `check` unit is what the registry compiles ON ITS OWN to prove the
# package builds; `mc_teko.tk`, the unit the fixed point compiles, is this
# tree's) is docs/specs/packages.md, over the distribution decisions that
# DECISION_LOG.md D15, D16 and D26 record. D26's correction: the key mc's R3
# reads is `language`, not `toolchain` -- and it derives the language from
# `[deps] teko` when the key is absent, so a library over that dependency
# (teko_std and any other) never needs to write it; `teko` itself, the
# compiler package, declares no such dep and so carries the key explicitly.

[package]
name     = "teko"
# a teko package for the registry; mc ignores an unknown [package] key.
language = "teko"
# SPDX identifier; this repository is dual-licensed (LICENSE, LICENSE-MIT, LICENSE-APACHE).
licence  = "MIT OR Apache-2.0"
lib      = "lib/rt.tk"
files    = [
    "core_teko.mc",
    "lib/rt.tk",
    "lib/time.tk",
    "mc_teko.tk",
    "teko.tk",
    "teko_access.tk",
    "teko_array.tk",
    "teko_class.tk",
    "teko_const.tk",
    "teko_default.tk",
    "teko_deleg.tk",
    "teko_di.tk",
    "teko_enum.tk",
    "teko_expr.tk",
    "teko_float.tk",
    "teko_fwd.tk",
    "teko_generic.tk",
    "teko_heaparr.tk",
    "teko_iface.tk",
    "teko_loop.tk",
    "teko_ns.tk",
    "teko_ops.tk",
    "teko_over.tk",
    "teko_params.tk",
    "teko_prefix.tk",
    "teko_prim.tk",
    "teko_prop.tk",
    "teko_rc.tk",
    "teko_ref.tk",
    "teko_stmt.tk",
    "teko_struct.tk",
    "teko_switch.tk",
    "teko_ternary.tk",
    "teko_this.tk",
    "teko_time.tk",
    "teko_trait.tk",
    "teko_type.tk",
    "teko_typeof.tk",
    "user.mc",
]
check    = ["mc_teko.tk"]
