# mc.toml -- this repository, as the package `teko`. It carries NO [project]:
# the build config is `teko.toml` (`mc build . --config teko.toml`), because
# `mc pkg hash DIR` reads `DIR/mc.toml` and takes no `--config`, so the package
# manifest and the build config cannot share one file once the package IS the
# repository. It is the split `minicompiler/mc`'s own root uses, and it is why
# `mc build .` here answers `missing key: project.entry`, on purpose.
#
# The tree hash digests these BYTES, comments included, so this header is
# written once and left alone. What `lib`, `files` and `check = ["mc_teko.tk"]`
# mean -- a `check` unit is compiled ON ITS OWN by the STOCK mc, with no teko
# module loaded, and `mc_teko.tk` is the only unit of this tree that still is
# -- is docs/specs/packages.md, over the distribution decision DECISION_LOG.md
# D15 records.

[package]
name  = "teko"
lib   = "lib/rt.tk"
files = [
    "core_teko.mc",
    "lib/rt.tk",
    "mc_teko.tk",
    "teko.tk",
    "teko_access.tk",
    "teko_array.tk",
    "teko_class.tk",
    "teko_const.tk",
    "teko_default.tk",
    "teko_deleg.tk",
    "teko_di.tk",
    "teko_expr.tk",
    "teko_float.tk",
    "teko_fwd.tk",
    "teko_generic.tk",
    "teko_heaparr.tk",
    "teko_iface.tk",
    "teko_loop.tk",
    "teko_ns.tk",
    "teko_ops.tk",
    "teko_over.tk",
    "teko_params.tk",
    "teko_prefix.tk",
    "teko_prop.tk",
    "teko_rc.tk",
    "teko_ref.tk",
    "teko_stmt.tk",
    "teko_struct.tk",
    "teko_switch.tk",
    "teko_ternary.tk",
    "teko_this.tk",
    "teko_trait.tk",
    "teko_type.tk",
    "teko_typeof.tk",
    "user.mc",
]
check = ["mc_teko.tk"]
