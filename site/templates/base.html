<!doctype html>
<!-- Derived from minicompiler/mc's site/templates/base.html (MIT). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{page_description}}">
<link rel="canonical" href="{{page_url}}">
<link rel="icon" href="{{base_url}}static/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="{{base_url}}static/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{base_url}}static/icon-180.png">
<link rel="stylesheet" href="{{base_url}}static/site.css">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site_title}}">
<meta property="og:title" content="{{page_title}}">
<meta property="og:description" content="{{page_description}}">
<meta property="og:url" content="{{page_url}}">
<meta property="og:image" content="{{base_url}}static/social.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>

<!--if nav-->
<!-- The sidebar toggle is a checkbox so that the menu opens with no JavaScript.
     It sits here, at the top of <body>, because the CSS reaches the sidebar
     with a sibling combinator (.nav-toggle:checked ~ .layout .site-nav).
     Above 900px both the checkbox and its label are display:none, which also
     removes the invisible tab stop. -->
<input class="nav-toggle" type="checkbox" id="nav-toggle">
<!--endif-->

<header class="site-header">
  <!-- Guri, the baby guara: docs/brand/mascot.svg, copied into static/ because
       the generator publishes that directory and no other. The image is
       decorative here - the wordmark beside it is the link's accessible name. -->
  <a class="brand" href="{{base_url}}">
    <img class="mark" src="{{base_url}}static/mascot.svg" alt="" width="24" height="24">
    <span>{{site_title}}</span>
  </a>
  <!--if nav-->
  <label class="nav-button" for="nav-toggle">
    <svg class="bars" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" fill="none"></path>
    </svg>
    Menu
  </label>
  <!--endif-->
  <!-- The four sections this generator renders, then whatever [site].nav_extra
       names: the package index and the repository, which mcsite links to and
       does not render. -->
  <nav class="header-nav" aria-label="Site sections">
    <a href="{{base_url}}guide/">Guide</a>
    <a href="{{base_url}}reference/">Reference</a>
    <a href="{{base_url}}specs/">Specs</a>
    <a href="{{base_url}}internals/">Internals</a>
{{nav_extra}}  </nav>
  <!-- The search form and the script that fills it. Empty when search is off in
       site.toml; the form itself is hidden until the script reveals it, so a
       reader without JavaScript is never given a box that cannot search. -->
  {{search}}
</header>

{{content}}

<footer class="site-footer">
  <div class="inner">
    <span>{{site_title}} &mdash; a language taught to <a href="https://github.com/minicompiler/mc">mc</a>.</span>
    <span>&copy; {{year}}</span>
    <span class="spacer"><a href="{{base_url}}reference/">Reference</a></span>
  </div>
</footer>
</body>
</html>
