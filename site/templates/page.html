<!-- Derived from minicompiler/mc's site/templates/page.html (MIT); unchanged. -->
<div class="layout">

  <nav class="site-nav" aria-label="Documentation">
    {{nav}}
  </nav>

  <main class="content" id="content">
    {{content}}

    <nav class="pager" aria-label="Previous and next page">
      <!--if prev_url-->
      <a class="pager-prev" href="{{prev_url}}" rel="prev">
        <span class="dir">&larr; Previous</span>
        <span class="pager-title">{{prev_title}}</span>
      </a>
      <!--endif-->
      <!--if next_url-->
      <a class="pager-next" href="{{next_url}}" rel="next">
        <span class="dir">Next &rarr;</span>
        <span class="pager-title">{{next_title}}</span>
      </a>
      <!--endif-->
    </nav>

    <!--if edit_url-->
    <p class="page-edit"><a href="{{edit_url}}">Edit this page</a></p>
    <!--endif-->
  </main>

  <aside class="outline" aria-label="On this page">
    <h2>On this page</h2>
    {{toc}}
  </aside>

</div>
