# site.toml - everything mcsite needs to know about teko-lang.org.
#
#   mcsite site          # renders ../docs into site/public
#   mcsite site --check  # the same, then validates links, structure and contrast
#
# The generator is NOT vendored here: `mcsite` is `minicompiler/mc`'s own
# generator, built from the release this repository is pinned to (MC_VERSION)
# by .github/workflows/site.yml. Its contract - every key below, every template
# placeholder, the Markdown subset - is that project's own site/README.md.
#
# Every path here is relative to THIS FILE's directory, never to the working
# directory: the same rule mc.toml follows in `mc build`.

[site]
title   = "teko"
tagline = "a language taught to mc"

# The home page's own prose is home-extra.md; this is its <meta name=description>
# and og:description. Every other page uses its own first paragraph.
description = "teko is a C#-like language taught to mc: classes, interfaces, traits, generics, delegates, compile-time dependency injection and scope-based reference counting, on five native (os, arch) pairs."

# The URL prefix of every asset and internal link, always ending in '/'. This
# site is served at the root of its own domain, so it is just "/".
base_url = "/"
origin   = "https://teko-lang.org"

# <title> is composed by the generator: "Getting started - teko".
title_separator = " - "

# The footer's year is data, not the system clock: a build must not depend on
# the day it runs.
year = "2026"

# Prefix of "Edit this page"; the page's path in the repository is appended.
edit_url = "https://github.com/teko-org/teko-lang/blob/main/"

# search.json, the header form and static/search.js.
search = true

# Rendered into the home page's `.home-extra`, under the hero and the cards
# templates/home.html holds. The generator resolves this key against `docs`, so
# the file lives there: `docs/home-extra.md`, which also puts its teko fence
# under `sh scripts/check-docs.sh` -- compiled and RUN like every other one.
home = "home-extra.md"

docs      = "../docs"
out       = "public"
templates = "templates"
static    = "static"
repo      = ".."

# Fence languages that go through the bundled lexer. That lexer is mc's own, so
# a teko fence is coloured for what the two share - the types, `if`/`return`,
# comments, strings, `#include` - and teko's own words come out as identifiers;
# a fence whose punctuation mc has no token for (the ternary and the switch
# expression, today two of the sixty-seven) is written out plain, which is a
# note on stderr and not an error. It still gets the code block's frame.
highlight = ["mc", "teko"]

# The sections, in the order they appear in the sidebar and in the reading
# order the pager follows - docs/README.md's own order. `docs/history/` is a
# pointer to a PRIVATE repository and `docs/brand/` is asset metadata: neither
# is a section, so neither is rendered, and a link to either resolves through
# `edit_url` to the file on GitHub.
nav = ["guide", "reference", "specs", "internals"]

# Header links mcsite does not render a page for. The registry is mc's own
# integrated index (DECISION_LOG.md D26): `pkg.minicompiler.dev` is its
# canonical host, `pkg.teko-lang.org` an alias serving the same bytes, and the
# per-language listing (`?language=teko`) arrives with mc's R3. Until then
# this names the index route that is live today.
nav_extra = ["packages", "github"]

[navlink.packages]
title = "Packages"
url   = "https://minicompiler.dev/packages"

[navlink.github]
title = "GitHub"
url   = "https://github.com/teko-org/teko-lang"

[section.guide]
title = "Guide"
dir   = "guide"
url   = "guide/"

# The guide's numeric prefixes already sort into reading order; the other three
# sections name theirs, because a reference sorted by file name reads as an
# alphabet rather than as a subject.
[section.reference]
title = "Reference"
dir   = "reference"
url   = "reference/"
order = ["types", "classes", "generics", "delegates", "arrays", "namespaces",
         "control-flow", "parameters", "di", "memory", "runtime", "build",
         "diagnostics", "not-yet"]

[section.specs]
title = "Specs"
dir   = "specs"
url   = "specs/"
order = ["surface", "packages", "self-hosting", "dependency-injection",
         "params-typed", "roadmap-1.0"]

[section.internals]
title = "Internals"
dir   = "internals"
url   = "internals/"
order = ["modules", "passes", "nodes-and-xt", "runtime", "di", "bootstrap",
         "ci", "pitfalls", "debts"]
