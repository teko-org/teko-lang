# teko.toml -- how this repository is BUILT, and nothing else:
#
#   mc build . --config teko.toml      # from the repository root
#
# The package manifest is `mc.toml` and holds only `[package]`: `mc pkg hash
# DIR` reads `DIR/mc.toml` and takes no `--config`, so the two roles cannot
# share one file once the package is the repository itself. It is the split
# `minicompiler/mc` uses at its own root (docs/reference/packages.md § The `mc`
# package), and it is why `mc build .` without `--config` answers
# `mc.toml: missing key: project.entry`.
#
# The `--config` path stays RELATIVE, without `./`, and at the package root.
# Every path `mc` reads is resolved against the CONFIG's own directory, and
# that directory is also the project root the `internal` guard measures from
# (D224): `cfg/teko.toml` cannot find `core_teko.mc`, and `./teko.toml` leaves
# that guard blind.
#
# Two steps come out of a build: the taught compiler (`build/teko`, D64.1's
# five parts -- `core_teko.mc` names four of them, `[compiler].core` the fifth
# -- plus `teko.tk`, docs/design/port-teko-mc.md) and then tests/hello.tk
# compiled BY that binary into a native executable. Nothing in the `mc`
# repository's `src/` changes: every new construct lives here, in this
# repository's root (D211/D212 in DECISION_LOG.md).
#
# `os = "linux"` / `arch = "x86_64"` matches the CI runner (ubuntu-latest);
# a host that does not link that pair derives its own config from this file
# (README.md, HANDOFF.md §4) instead of editing it. There is no `[sysroot]`
# because `[linker]` is the system's own `cc`, which already knows where its
# crt objects and libc are -- one line instead of pinning a musl sysroot for a
# program that, so far, links no libc symbol beyond `write`/`exit` (lib/rt.tk).

[project]
name  = "teko"
entry = "tests/hello.tk"
out   = "build/teko-hello"
kind  = "exe"

[target]
os   = "linux"
arch = "x86_64"

[compiler]
core    = "<mc/core_min>"
modules = ["core_teko.mc", "teko.tk", "user.mc"]
out     = "build/teko"

[linker]
cmd  = "cc"
args = ["-o", "{out}", "{obj}"]

# the static estimate is a function of source bytes and a taught compiler
# this small does not land anywhere near it; 1.0 is examples/lang's own
# starting point (see that project's mc.toml for the full rationale) and
# `mc limits . --config teko.toml` is what tells whether it still holds once
# this project grows past the vertical slice.
[limits]
tolerance = 1.0

[include]
paths = ["lib"]
